<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Love Animation 💗</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: radial-gradient(circle at center, #1a001a, #000);
  font-family: Arial, sans-serif;
}

/* Main text */
.love-text {
  position: absolute;
  top: 38%;
  width: 100%;
  text-align: center;
  font-size: 2.5rem;
  color: #ff80bf;
  text-shadow: 0 0 20px #ff4da6, 0 0 40px #ff1a8c;
  animation: glow 2s infinite alternate;
}

/* Kiss text */
.kiss-text {
  position: absolute;
  top: 50%;
  width: 100%;
  text-align: center;
  font-size: 2rem;
  color: #ff66b3;
  text-shadow: 0 0 15px #ff4da6;
  animation: fadeIn 3s infinite alternate;
}

@keyframes fadeIn {
  from { opacity: 0.4; }
  to { opacity: 1; }
}

@keyframes glow {
  from { text-shadow: 0 0 10px #ff4da6; }
  to { text-shadow: 0 0 30px #ff1a8c, 0 0 60px #ff66b3; }
}

/* Heart */
.heart {
  position: absolute;
  width: 20px;
  height: 20px;
  background: #ff4da6;
  transform: rotate(45deg);
  animation: float 8s linear infinite;
}

.heart::before,
.heart::after {
  content: "";
  position: absolute;
  width: 20px;
  height: 20px;
  background: #ff4da6;
  border-radius: 50%;
}

.heart::before { top: -10px; left: 0; }
.heart::after { left: -10px; top: 0; }

/* Kiss emoji animation */
.kiss {
  position: absolute;
  font-size: 24px;
  animation: floatKiss 6s linear infinite;
}

@keyframes float {
  0% { transform: translateY(100vh) rotate(45deg); opacity: 1; }
  100% { transform: translateY(-10vh) rotate(45deg); opacity: 0; }
}

@keyframes floatKiss {
  0% { transform: translateY(100vh); opacity: 1; }
  100% { transform: translateY(-10vh); opacity: 0; }
}
</style>
</head>

<body>

<div class="love-text">Love You Bachaaa 💗</div>
<div class="kiss-text">Muuwwaaahhh 💗💗😘😘</div>

<script>
// Hearts
for (let i = 0; i < 30; i++) {
  let heart = document.createElement("div");
  heart.className = "heart";
  
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = (5 + Math.random() * 5) + "s";
  heart.style.opacity = Math.random();
  heart.style.transform = "scale(" + (0.5 + Math.random()) + ") rotate(45deg)";
  
  document.body.appendChild(heart);
}

// Kiss emojis
for (let i = 0; i < 15; i++) {
  let kiss = document.createElement("div");
  kiss.className = "kiss";
  kiss.innerHTML = "😘";
  
  kiss.style.left = Math.random() * 100 + "vw";
  kiss.style.animationDuration = (4 + Math.random() * 4) + "s";
  
  document.body.appendChild(kiss);
}
</script>

</body>
</html>
