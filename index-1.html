<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Love Animation 💗</title>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: radial-gradient(circle at center, #1a001a, #000);
  font-family: Arial, sans-serif;
}

/* Main text */
.love-text {
  position: absolute;
  top: 30%;
  width: 100%;
  text-align: center;
  font-size: 2.5rem;
  color: #ff80bf;
  text-shadow: 0 0 20px #ff4da6;
}

/* Question Box */
.question-box {
  position: absolute;
  top: 55%;
  width: 100%;
  text-align: center;
  color: white;
}

button {
  padding: 10px 20px;
  margin: 10px;
  border: none;
  border-radius: 20px;
  background: #ff4da6;
  color: white;
  font-size: 1rem;
  cursor: pointer;
}

button:hover {
  background: #ff1a8c;
}

/* Heart */
.heart {
  position: absolute;
  width: 20px;
  height: 20px;
  background: #ff4da6;
  transform: rotate(45deg);
  animation: float 8s linear infinite;
}

.heart::before,
.heart::after {
  content: "";
  position: absolute;
  width: 20px;
  height: 20px;
  background: #ff4da6;
  border-radius: 50%;
}

.heart::before { top: -10px; left: 0; }
.heart::after { left: -10px; top: 0; }

@keyframes float {
  0% { transform: translateY(100vh) rotate(45deg); opacity: 1; }
  100% { transform: translateY(-10vh) rotate(45deg); opacity: 0; }
}
</style>
</head>

<body>

<div class="love-text">Love You Bachaaa 💗</div>

<div class="question-box">
  <h2>Do you love me? 💗</h2>
  <button onclick="sendResponse('Yes 💗')">Yes 💗</button>
  <button onclick="sendResponse('No 💔')">No 💔</button>
</div>

<script>
// INIT EMAILJS (replace with your PUBLIC KEY)
(function(){
  emailjs.init("YOUR_PUBLIC_KEY");
})();

function sendResponse(answer) {
  emailjs.send("service_mradul10", "YOUR_TEMPLATE_ID", {
    message: answer,
    to_email: "Newszoneglobal@gmail.com"
  })
  .then(function(response) {
    alert("Response sent 💗");
  }, function(error) {
    alert("Failed to send 😢");
  });
}

// Hearts animation
for (let i = 0; i < 30; i++) {
  let heart = document.createElement("div");
  heart.className = "heart";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = (5 + Math.random() * 5) + "s";
  document.body.appendChild(heart);
}
</script>

</body>
</html>
